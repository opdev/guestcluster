# This rule is not used by the project guestcluster-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to guestcluster.opdev.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: guestcluster-operator
    app.kubernetes.io/managed-by: kustomize
  name: clusterinstance-viewer-role
rules:
- apiGroups:
  - guestcluster.opdev.io
  resources:
  - clusterinstances
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - guestcluster.opdev.io
  resources:
  - clusterinstances/status
  verbs:
  - get
