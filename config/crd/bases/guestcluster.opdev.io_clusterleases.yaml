---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: clusterleases.guestcluster.opdev.io
spec:
  group: guestcluster.opdev.io
  names:
    kind: ClusterLease
    listKind: ClusterLeaseList
    plural: clusterleases
    shortNames:
    - clease
    singular: clusterlease
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.instanceRef.name
      name: Instance
      type: string
    - jsonPath: .status.ocpVersion
      name: Version
      type: string
    - jsonPath: .status.topology
      name: Topology
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterLease is the Schema for the clusterleases API. CI creates a ClusterLease to
          acquire an available guest cluster of a given topology from a ClusterPool; deleting
          the ClusterLease releases the instance back to the pool for recycling.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterLeaseSpec defines the desired state of ClusterLease.
            properties:
              poolRef:
                description: |-
                  PoolRef names the ClusterPool to lease from, in this namespace. The
                  requested guest cluster topology is determined by the referenced
                  ClusterPool's Spec.Type (echoed back on Status.Topology once bound);
                  it is not duplicated here, since a ClusterPool name is unique within
                  a namespace and therefore already unambiguously implies its type.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              requestedBy:
                description: |-
                  RequestedBy is a free-form identifier of the CI job/run requesting this lease,
                  recorded for audit purposes only.
                type: string
              ttl:
                description: |-
                  TTL bounds how long the lease may remain Bound before the controller forcibly
                  releases and recycles the underlying instance, protecting the pool from CI jobs
                  that fail to release. A value of 0 (or omitted) means no TTL enforcement.
                type: string
            required:
            - poolRef
            type: object
          status:
            description: ClusterLeaseStatus defines the observed state of ClusterLease.
            properties:
              apiEndpoint:
                description: APIEndpoint is the bound guest cluster's API server URL,
                  mirrored for convenience.
                type: string
              boundTime:
                description: BoundTime is when this lease was bound to an instance.
                format: date-time
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the lease's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              instanceRef:
                description: |-
                  InstanceRef names the ClusterInstance claimed by this lease, once Phase=Bound.
                  This is THE SINGLE SOURCE OF TRUTH for the lease<->instance binding (analogous to
                  a Kubernetes Pod's Spec.NodeName): it is written exactly once, atomically with
                  Phase transitioning to Bound, by ClusterLeaseReconciler, and never duplicated onto
                  the ClusterInstance side. An instance is considered claimed/in-use the moment a
                  non-terminal (Pending or Bound) ClusterLease's InstanceRef names it -- "assumed"
                  immediately, before the instance even necessarily exists yet in some accounting
                  paths -- so that ClusterPoolReconciler's supply accounting and ClusterInstance's
                  derived LeaseRef projection can never observe a state where the binding is
                  ambiguous or split across two independently-written records. (Formerly named
                  BoundInstanceRef.)
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              kubeconfigSecretRef:
                description: |-
                  KubeconfigSecretRef names the Secret (in this ClusterLease's namespace) containing
                  the bound guest cluster's admin kubeconfig under key "kubeconfig". This Secret is
                  copied/mirrored from the bound ClusterInstance's kubeconfig Secret so that CI can
                  consume a single, stable location regardless of which instance backs the lease.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              ocpVersion:
                description: |-
                  OCPVersion is the OpenShift version of the bound guest cluster; an explicit CI
                  output alongside Topology, expected to be recorded next to the artifact OCP line.
                type: string
              phase:
                description: Phase is the current lifecycle phase of the lease.
                enum:
                - Pending
                - Bound
                - Releasing
                - Released
                - Failed
                type: string
              topology:
                description: |-
                  Topology echoes the bound instance's topology (crc | hcp); an explicit
                  CI output. A mismatch between Spec.Type and this value should never occur and
                  indicates a controller bug if observed.
                enum:
                - crc
                - hcp
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
