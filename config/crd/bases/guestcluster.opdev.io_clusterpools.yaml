---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: clusterpools.guestcluster.opdev.io
spec:
  group: guestcluster.opdev.io
  names:
    kind: ClusterPool
    listKind: ClusterPoolList
    plural: clusterpools
    shortNames:
    - cpool
    singular: clusterpool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.maxSize
      name: Max
      type: integer
    - jsonPath: .status.totalInstances
      name: Total
      type: integer
    - jsonPath: .status.availableInstances
      name: Available
      type: integer
    - jsonPath: .status.leasedInstances
      name: Leased
      type: integer
    - jsonPath: .status.conditions[?(@.type=="CapacityAvailable")].reason
      name: Capacity
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterPool is the Schema for the clusterpools API. It declares a budgeted pool of
          guest OpenShift clusters (CRC or HyperShift) that CI jobs can lease from via
          ClusterLease objects.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterPoolSpec defines the desired state of ClusterPool.
            properties:
              maxSize:
                description: |-
                  MaxSize is the hard budget cap: the pool will never have more than this many
                  ClusterInstances (Ready+Leased+Provisioning) at once. Enforced by the
                  ClusterPool controller and used by the ClusterLease controller to decide
                  whether a new instance may be provisioned on-demand.
                format: int32
                minimum: 1
                type: integer
              minSize:
                default: 0
                description: |-
                  MinSize is the minimum number of ClusterInstances (any non-terminal phase --
                  Provisioning, Ready, or Leased) the pool controller keeps in existence at all
                  times, independent of lease demand. Unlike WarmSpares, this is a stable,
                  total-count floor: an instance transitioning Ready->Leased (or back) does not
                  change how many instances count against it, so top-up/scale-down against
                  MinSize cannot race with ClusterLease binding. 0 (the default) means the pool
                  may shrink to zero instances when there is no demand and WarmSpares is also 0
                  (pure on-demand provisioning). Subject to MaxSize.
                format: int32
                type: integer
              template:
                description: Template describes how to provision new ClusterInstances
                  for this pool.
                properties:
                  bundleSSHKeyRef:
                    description: |-
                      BundleSSHKeyRef references a Secret (in the operator's namespace) containing the
                      CRC bundle's SSH private key (the "id_ecdsa_crc" file shipped inside an official
                      .crcbundle, used to reach the booted VM as user "core"), under a data key named
                      "id_ecdsa" or "ssh-privatekey". This is a FALLBACK: when CRCVersion is set, the
                      SSH key is instead derived automatically from the referenced CRCBundle and this
                      field is ignored. When CRCVersion is unset, this is required for topology=crc:
                      the crc-agent Job uses this key to SSH into the freshly booted CRC VM and run
                      the post-boot fixups natively (start kubelet,
                      approve kubelet CSRs, inject the real pull secret, set credentials, rewrite the
                      kubeconfig server to the externally-routable API Route hostname the
                      ClusterInstance controller provisions). Ignored for topology=hcp.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  controllerAvailabilityPolicy:
                    default: SingleReplica
                    description: |-
                      ControllerAvailabilityPolicy sets the HostedCluster control-plane
                      availability for topology=hcp: SingleReplica or HighlyAvailable. Defaults
                      to SingleReplica, since HighlyAvailable's 3-way etcd/kube-apiserver spread
                      requires anti-affinity across that many schedulable, untainted nodes on
                      the management cluster, which small/dev management clusters (e.g.
                      CRC-hosted) often don't have -- HighlyAvailable is consequently opt-in.
                      This maps directly to HostedCluster.spec.controllerAvailabilityPolicy,
                      which is immutable once the HostedCluster is created: changing this field
                      on an existing ClusterTemplate has no effect on already-provisioned
                      instances. Ignored for topology=crc.
                    enum:
                    - SingleReplica
                    - HighlyAvailable
                    type: string
                  cores:
                    description: Cores is the number of vCPUs allocated per VM.
                    format: int32
                    minimum: 1
                    type: integer
                  crcArch:
                    description: |-
                      CRCArch is the CPU architecture of the CRC bundle to fetch when CRCVersion is
                      set. Defaults to "amd64" if left empty. Ignored when CRCVersion is unset, and
                      for topology=hcp.
                    enum:
                    - amd64
                    - arm64
                    type: string
                  crcVersion:
                    description: |-
                      CRCVersion, when set (topology=crc only), is the turnkey path: the admin
                      specifies only a CRC/OpenShift Local version (e.g. "4.16.0") and the operator
                      downloads, verifies, and extracts the official bundle for that version via a
                      cluster-scoped CRCBundle (auto-created and reused across pools/instances -- see
                      api/v1alpha1/crcbundle_types.go), then clones its cached crc.qcow2 and SSH key
                      for this instance. When set, ReleaseImage and BundleSSHKeyRef below are ignored
                      (they are derived from the CRCBundle instead). Ignored for topology=hcp.
                    type: string
                  hcpWorkerSSHKeyRef:
                    description: |-
                      HCPWorkerSSHKeyRef optionally references a Secret (in the operator's namespace)
                      containing an SSH public key, under a data key named "id_rsa.pub", to inject as
                      an authorized key for the "core" user on every hcp NodePool worker (via
                      HostedCluster.spec.sshKey -- see HyperShift's own ignition machine-config
                      generation). This is purely a debugging convenience (e.g. to inspect a worker
                      that is stuck before ever registering as a Node) and has no effect on cluster
                      function; most deployments should leave it unset. Ignored for topology=crc
                      (see BundleSSHKeyRef for that path's own, unrelated SSH mechanism).
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  idmsRef:
                    description: |-
                      IDMSRef optionally references an ImageDigestMirrorSet-shaped ConfigMap applied at
                      provision time for disconnected/mirrored registries. Interpreted per-topology:
                      for hcp it seeds HostedCluster.spec.imageContentSources; for crc it is applied
                      as an ImageDigestMirrorSet inside the guest cluster post-boot.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  memory:
                    description: |-
                      Memory is the amount of memory allocated per VM (CRC VM, or each HyperShift KubeVirt
                      worker VM). E.g. "16Gi" for CRC, "6Gi" for a HyperShift worker.
                    type: string
                  nodePoolReplicas:
                    description: |-
                      NodePoolReplicas is the number of worker replicas for topology=hcp. Ignored
                      for topology=crc. Defaults to 1 when unset.
                    format: int32
                    minimum: 1
                    type: integer
                  ocpVersion:
                    description: |-
                      OCPVersion is the expected/recorded OpenShift version for clusters provisioned from
                      this template (e.g. "4.16.10"). It is echoed back on ClusterInstance.status.ocpVersion
                      once the guest cluster reports its own version, and is used to detect drift.
                    type: string
                  pullSecretRef:
                    description: |-
                      PullSecretRef references a Secret (in the operator's namespace) containing the
                      pull-secret used to pull the release payload / CRC bundle images. Optional:
                      when unset, the operator defaults to the management cluster's own global
                      pull secret (the "pull-secret" Secret in the "openshift-config" namespace),
                      which is present on every OpenShift cluster. Set this explicitly to use a
                      different/narrower credential (e.g. one scoped to a disconnected mirror).
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  releaseImage:
                    description: |-
                      ReleaseImage is the OCP release payload image used to provision the guest
                      cluster. For topology=crc this is a FALLBACK to the turnkey CRCVersion path
                      above: when CRCVersion is unset, this MUST be an HTTP(S) URL to the
                      *extracted* crc.qcow2 disk image from an official CRC/OpenShift Local
                      .crcbundle (NOT the .crcbundle tar itself) -- e.g. extract via
                      `curl <bundle-url> | tar --zstd -xf -` and host the resulting crc.qcow2 at a
                      URL reachable by CDI's HTTP DataVolume importer. For topology=hcp this is
                      always the HyperShift/OCP release image pullspec (required, CRCVersion does
                      not apply).
                    type: string
                  rootVolumeSize:
                    description: RootVolumeSize is the size of the root disk (e.g.
                      "35Gi").
                    type: string
                  storageClassName:
                    description: StorageClassName is the StorageClass used for VM
                      root/data volumes.
                    type: string
                  vmNodeSelector:
                    additionalProperties:
                      type: string
                    description: VMNodeSelector constrains which hypervisor node(s)
                      the guest VM(s) are scheduled to.
                    type: object
                required:
                - cores
                - memory
                - ocpVersion
                type: object
              type:
                description: Type is the topology of guest clusters this pool manages.
                enum:
                - crc
                - hcp
                type: string
              warmSpares:
                default: 0
                description: |-
                  WarmSpares is the number of Ready, unleased ClusterInstances the pool
                  controller tries to keep provisioned ahead of demand, so that a ClusterLease
                  can bind instantly instead of waiting for a full provision. This floor is
                  measured against spare (available) capacity, so it rises with load: under N
                  active leases the pool targets roughly N+WarmSpares total instances. Subject
                  to MaxSize. (Formerly named MinAvailable.)
                format: int32
                type: integer
            required:
            - maxSize
            - template
            - type
            type: object
            x-kubernetes-validations:
            - message: maxSize must be greater than or equal to minSize
              rule: self.maxSize >= self.minSize
            - message: maxSize must be greater than or equal to warmSpares
              rule: self.maxSize >= self.warmSpares
          status:
            description: ClusterPoolStatus defines the observed state of ClusterPool.
            properties:
              availableInstances:
                description: AvailableInstances is the count of Ready, unleased ClusterInstances.
                format: int32
                type: integer
              conditions:
                description: Conditions represent the latest available observations
                  of the pool's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              leasedInstances:
                description: LeasedInstances is the count of ClusterInstances currently
                  bound to a ClusterLease.
                format: int32
                type: integer
              totalInstances:
                description: |-
                  TotalInstances is the current count of ClusterInstances owned by this pool
                  (any phase except Failed/deleted).
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
