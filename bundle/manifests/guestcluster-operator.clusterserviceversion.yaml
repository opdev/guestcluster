      deployments:
      - label:
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: guestcluster-operator
          control-plane: controller-manager
        name: guestcluster-operator-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: guestcluster-operator
              control-plane: controller-manager
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                app.kubernetes.io/name: guestcluster-operator
                control-plane: controller-manager
            spec:
              containers:
              - args:
                - --metrics-bind-address=:8443
                - --leader-elect
                - --health-probe-bind-address=:8081
                command:
                - /manager
                env:
                - name: CRC_AGENT_IMAGE
                  value: opdev.io/guestcluster-operator-crc-agent:latest
                - name: OPERATOR_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: BUNDLE_PREP_SERVICE_ACCOUNT
                  value: guestcluster-operator-bundle-prep
                - name: CRC_AGENT_SERVICE_ACCOUNT
                  value: guestcluster-operator-crc-agent
                - name: CRC_AGENT_CLUSTER_ROLE
                  value: guestcluster-operator-crc-agent-instance-role
                image: opdev.io/guestcluster-operator:latest
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 128Mi
                  requests:
                    cpu: 10m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: guestcluster-operator-controller-manager
              terminationGracePeriodSeconds: 10
      permissions:
